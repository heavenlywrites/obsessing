<style>
  :root { --pink:#f9d3df; --text:#f2b8ca; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#fff; min-height:100vh; display:flex; justify-content:center; font-family:'Pinyon Script',cursive; color:var(--text); }
  main { width:100%; max-width:400px; padding:48px 24px 56px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .pfp { width:96px; height:96px; border-radius:50%; object-fit:cover; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  h1 { font-family:'Pinyon Script',cursive; font-weight:400; font-size:34px; color:var(--text); margin-top:22px; line-height:1.2; }
  .socials { display:flex; gap:22px; margin-top:16px; }
  .socials a { display:flex; transition:transform .2s, opacity .2s; }
  .socials a:hover { transform:translateY(-2px); opacity:.8; }
  .socials svg { width:22px; height:22px; fill:var(--pink); }
  .tagline { font-family:'EB Garamond',serif; font-size:15px; line-height:1.6; letter-spacing:.02em; margin-top:26px; }
  .tagline a { color:var(--text); text-decoration:underline; text-decoration-color:var(--pink); text-underline-offset:3px; }
  .spacer { height:36px; }
  .books { font-family:'EB Garamond',serif; font-size:16px; letter-spacing:.02em; color:var(--text); text-decoration:underline; text-decoration-color:var(--pink); text-underline-offset:4px; transition:opacity .2s; }
  .books:hover { opacity:.75; }
  .bunny { width:48px; margin-top:30px; }
</style>
